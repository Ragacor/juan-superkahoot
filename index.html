<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Juan SuperKahoot">

<title>Juan Social Science SuperKahoot V4</title>
<style>
:root{--navy:#103f68;--blue:#2f80ed;--red:#e53935;--green:#27ae60;--yellow:#f2c300;--cream:#fff7db;--ink:#203040}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#e7f1ff,#fff);color:var(--ink)}
.app{max-width:820px;margin:0 auto;padding:16px}
.card{background:white;border-radius:28px;padding:22px;box-shadow:0 10px 28px rgba(0,0,0,.14);margin:14px 0}
h1{font-size:42px;line-height:1.05;text-align:center;color:var(--navy);margin:10px 0 6px;font-weight:900}
h2{color:var(--navy);margin-top:18px}.sub{text-align:center;font-size:20px;margin:6px 0 22px}
.mainbtn,.smallbtn{width:100%;border:0;border-radius:24px;padding:23px 18px;margin:11px 0;font-size:27px;font-weight:900;box-shadow:0 8px 0 rgba(0,0,0,.16);cursor:pointer}
.mainbtn{background:var(--navy);color:white}.smallbtn{background:#e9eef5;color:var(--navy);font-size:21px}
.mainbtn:active,.smallbtn:active{transform:translateY(2px);box-shadow:0 4px 0 rgba(0,0,0,.16)}
.hidden{display:none!important}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.toggle{font-size:21px;font-weight:900;margin:14px 0}.toggle input{width:34px;height:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .smallbtn{font-size:18px;padding:18px 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.badge{background:var(--navy);color:white;border-radius:999px;padding:10px 13px;font-size:15px;font-weight:900}.timer{font-size:28px;font-weight:900;color:var(--navy)}
.bar{height:15px;background:#dbe8f5;border-radius:999px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:var(--green);width:0%;transition:.2s}
.qtype{text-align:center;color:#64748b;font-weight:900;margin-top:4px}.question{font-size:29px;font-weight:900;text-align:center;line-height:1.22;margin:28px 0}
.option{display:flex;border:2px solid #dce3ea;border-radius:16px;overflow:hidden;margin:13px 0;background:white;min-height:66px;width:100%;text-align:left;cursor:pointer}.letter{width:60px;color:white;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}.txt{font-size:23px;font-weight:850;padding:18px;flex:1;display:flex;align-items:center}.a .letter{background:var(--blue)}.b .letter{background:var(--red)}.c .letter{background:var(--green)}.d .letter{background:var(--yellow);color:#222}
.correct{background:#eafaf1;border-color:var(--green)}.wrong{background:#fff0ef;border-color:var(--red)}.feedback{text-align:center;font-size:28px;font-weight:900;min-height:42px;margin-top:8px}.good{color:var(--green)}.bad{color:var(--red)}
.score{font-size:70px;font-weight:900;color:var(--navy);text-align:center}.summary{text-align:center;font-size:22px;margin:10px 0 20px}.miss{border-left:8px solid var(--red);background:#fff5f5;border-radius:14px;padding:14px;margin:12px 0;font-size:17px}.star{font-size:38px;text-align:center;margin:8px 0}.note{font-size:14px;color:#667;text-align:center;line-height:1.35}
.pill{display:inline-block;background:#eef5ff;color:#103f68;border-radius:999px;padding:6px 10px;font-weight:900;font-size:13px;margin:3px}
@media(max-width:520px){h1{font-size:36px}.question{font-size:25px}.txt{font-size:20px}.mainbtn{font-size:23px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <section id="home" class="card">
    <h1>Social Science<br>SuperKahoot</h1>
    <div class="sub">Topics 5 + 6 practice for Juan</div>
    <div class="note"><span class="pill" id="poolSize"></span><span class="pill">Only PDF content</span><span class="pill">Random questions</span></div>
    <button class="mainbtn" id="topic5" type="button">Topic 5 Practice</button>
    <button class="mainbtn" id="topic6" type="button">Topic 6 Practice</button>
    <button class="mainbtn" id="exam40" type="button">Exam Mode: 40 Questions</button>
    <button class="mainbtn" id="mega80" type="button">Mega Mode: 80 Questions</button>
    <div class="grid2">
      <button class="smallbtn" id="allPool" type="button">Full Pool Practice</button>
      <button class="smallbtn" id="survival" type="button">Survival Mode</button>
    </div>
    <div class="card" style="box-shadow:none;background:#f7f9fc">
      <div class="row toggle"><span>⏱️ 2-minute timer</span><input id="timerToggle" type="checkbox" checked></div>
      <div class="row toggle"><span>🔊 Correct / wrong sounds</span><input id="musicToggle" type="checkbox" checked></div>
      <button id="stopMusic" class="smallbtn" type="button">Stop sounds</button>
    </div>
    <p class="note">Recommended: Exam Mode today and tomorrow. Then practise mistakes only.</p>
  </section>

  <section id="quiz" class="card hidden">
    <div class="top"><span id="topic" class="badge"></span><span id="section" class="badge"></span><span id="count" class="badge"></span><span id="time" class="timer">02:00</span></div>
    <div class="bar"><div id="progress"></div></div>
    <div id="type" class="qtype"></div>
    <div id="question" class="question"></div>
    <div id="options"></div>
    <div id="feedback" class="feedback"></div>
  </section>

  <section id="results" class="card hidden">
    <h1>Results</h1>
    <div id="stars" class="star"></div>
    <div id="score" class="score"></div>
    <div id="summary" class="summary"></div>
    <button id="retryWrong" class="mainbtn" type="button">Practise mistakes only</button>
    <button id="copy" class="smallbtn" type="button">Copy mistakes</button>
    <button id="download" class="smallbtn" type="button">Download mistakes</button>
    <button id="menu" class="smallbtn" type="button">Back to menu</button>
    <h2>Questions to review</h2>
    <div id="wrongList"></div>
  </section>
</div>

var quiz=[],idx=0,score=0,mistakes=[],lastMistakeQuestions=[],timer=null,left=120,audio=null,survivalMode=false;

function el(id){return document.getElementById(id)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function sample(a,n){return shuffle(a).slice(0,Math.min(n,a.length))}
function allowedFor(mode){
  if(mode==='Topic 5') return ALL.filter(function(q){return q.topic==='Topic 5'});
  if(mode==='Topic 6') return ALL.filter(function(q){return q.topic==='Topic 6'});
  return ALL;
}
function prepare(items){
  return shuffle(items).map(function(q){
    if(q.options.length===2)return q;
    var correct=q.options[q.answerIndex], opts=shuffle(q.options);
    return {topic:q.topic,section:q.section,type:q.type,question:q.question,options:opts,answerIndex:opts.indexOf(correct)};
  });
}
function start(mode,count,isSurvival){
  survivalMode=!!isSurvival;
  var base=allowedFor(mode);
  if(count) base=sample(base,count);
  startFromQuestions(base);
}
function startFromQuestions(base){
  quiz=prepare(base);idx=0;score=0;mistakes=[];
  el('home').classList.add('hidden');el('results').classList.add('hidden');el('quiz').classList.remove('hidden');
  show();
}
function show(){
  clearInterval(timer);

function choose(sel){

    score++;el('feedback').textContent='Correct! ✅';el('feedback').className='feedback good';soundCorrect();

  }

}
function finish(){
  clearInterval(timer);

  lastMistakeQuestions=mistakes.map(function(m){return m.original});
  el('retryWrong').style.display=mistakes.length?'block':'none';
  if(!mistakes.length){el('wrongList').innerHTML='<p class="good"><b>Perfect. No mistakes.</b></p>'}
  else{el('wrongList').innerHTML=mistakes.map(function(m,i){return '<div class="miss"><b>'+(i+1)+'. ['+safe(m.topic)+' / '+safe(m.section)+'] '+safe(m.question)+'</b><br>Your answer: '+safe(m.selected)+'<br>Correct answer: <b>'+safe(m.correct)+'</b></div>'}).join('')}
}
function safe(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
