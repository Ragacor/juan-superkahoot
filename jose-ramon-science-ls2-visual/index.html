const TOPICS=[...new Set(BANK.map(q=>q.topic))];
let round=[], index=0, score=0, mistakes=[], lastMistakes=[], timer=null, timeLeft=30, locked=false, soundCtx=null;
const $=id=>document.getElementById(id);
function show(id){clearInterval(timer); ['home','quiz','results'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
function shuffle(arr){arr=[...arr]; for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function start(topic,n){const pool=topic==='ALL'?BANK:BANK.filter(q=>q.topic===topic); round=shuffle(pool).slice(0, Math.min(n,pool.length)).map(q=>({...q, mixed:shuffle(q.answers)})); index=0; score=0; mistakes=[]; show('quiz'); render();}
function render(){clearInterval(timer); locked=false; if(index>=round.length) return finish(); const q=round[index]; $('topicBadge').textContent=q.topic; $('countBadge').textContent=`${index+1} / ${round.length}`; $('question').textContent=q.question; $('feedback').textContent=''; $('nextBtn').classList.add('hidden'); $('progress').style.width=((index)/round.length*100)+'%'; const wrap=$('imgwrap'); const img=$('qimg'); if(q.image){img.src=q.image; wrap.classList.remove('hidden');} else {img.removeAttribute('src'); img.alt=''; wrap.classList.add('hidden');} const opts=$('options'); opts.innerHTML=''; q.mixed.forEach((ans,i)=>{const b=document.createElement('button'); b.className='option'; b.innerHTML=esc(ans); b.onclick=()=>answer(i); opts.appendChild(b);}); timeLeft=30; if($('timerToggle').checked){$('clockBadge').textContent='⏱️ '+timeLeft+'s'; timer=setInterval(()=>{timeLeft--; $('clockBadge').textContent='⏱️ '+timeLeft+'s'; if(timeLeft<=0){clearInterval(timer); answer(-1);}},1000);} else {$('clockBadge').textContent='No timer';}}
function beep(ok){if(!$('soundToggle').checked) return; try{soundCtx=soundCtx||new(window.AudioContext||window.webkitAudioContext)(); const o=soundCtx.createOscillator(), g=soundCtx.createGain(); o.type='sine'; o.frequency.value=ok?660:240; g.gain.value=.05; o.connect(g); g.connect(soundCtx.destination); o.start(); o.stop(soundCtx.currentTime+.15);}catch(e){}}
function answer(i){if(locked) return; locked=true; clearInterval(timer); const q=round[index]; const chosen=i<0 ? 'No answer (time expired)' : q.mixed[i]; const ok=chosen===q.correct; if(ok) score++; else mistakes.push({...q, chosen}); [...$('options').children].forEach((b,idx)=>{b.disabled=true; if(q.mixed[idx]===q.correct) b.classList.add('correct'); else if(idx===i) b.classList.add('wrong');}); $('feedback').innerHTML = ok ? '✅ Correct!' : '❌ Correct answer: <b>'+esc(q.correct)+'</b>'; beep(ok); $('nextBtn').classList.remove('hidden');}
function nextQ(){index++; render();}
function finish(){lastMistakes=[...mistakes]; show('results'); $('score').textContent=Math.round(score/round.length*100)+'%'; $('summary').textContent=`${score} correct out of ${round.length} · ${mistakes.length} mistakes`; $('retryBtn').disabled=!mistakes.length; $('mistakes').innerHTML = mistakes.length ? mistakes.map((m,n)=>`<div class="mistake">${m.topic?`<div class="pill">${esc(m.topic)}</div>`:''}<div><b>${n+1}. ${esc(m.question)}</b></div><div>Your answer: ${esc(m.chosen)}</div><div>Correct answer: <b>${esc(m.correct)}</b></div></div>`).join('') : '<p class="center">Perfect score! 🎉</p>';}
function retryMisses(){if(!lastMistakes.length) return; round=shuffle(lastMistakes).map(q=>({...q, mixed:shuffle(q.answers)})); index=0; score=0; mistakes=[]; show('quiz'); render();}
function confirmExit(){if(confirm('Exit this quiz?')) show('home');}
function textMistakes(){return mistakes.length ? mistakes.map((m,n)=>`${n+1}. [${m.topic}] ${m.question}
Your answer: ${m.chosen}
Correct answer: ${m.correct}`).join('\n\n') : 'No mistakes — perfect score!';}
async function copyMistakes(){try{await navigator.clipboard.writeText(textMistakes()); alert('Mistakes copied.');}catch(e){alert('Copy failed on this browser.');}}
function downloadMistakes(){const blob=new Blob([textMistakes()],{type:'text/plain'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='JR_Science_LS2_visual_mistakes.txt'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('pool').textContent=`${BANK.length} questions · mixed text + image questions · based only on the supplied LS2 PDFs`;
const topicsDiv=$('topics'); TOPICS.forEach(t=>{const n=BANK.filter(q=>q.topic===t).length; const b=document.createElement('button'); b.className='btn secondary'; b.textContent=`${t} (${n})`; b.onclick=()=>start(t,9999); topicsDiv.appendChild(b);});
</script></body></html>
